[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "asali"
version = "3.6.0"
authors = [{name = "ASALI", email = "ste.rebu@outlook.it"}]
maintainers = [{name = "Stefano Rebughini", email="ste.rebu@outlook.it"}]
description = "A Python package to simulate chemical reactors"
license = {text = "GPL"}
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
]
requires-python = ">=3.12,<3.14"
readme = {file="README.md", content-type="text/markdown"}

[project.urls]
Homepage = "https://github.com/srebughini/ASALIPY"
Issues = "https://github.com/srebughini/ASALIPY/issues"

[tool.setuptools]
include-package-data = true
package-dir = {asali = "asali"}
packages = [
    "asali.utils",
    "asali.plotters",
    "asali.savers",
    "asali.reactors",
    "asali.reactors.shapes",
]
platforms = ["any"]
license-files = ["LICENSE"]
